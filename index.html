<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Discovery App</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome cho icon tìm kiếm, dark mode -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header chứa tiêu đề và nút chuyển đổi Light/Dark Mode -->
    <header class="app-header">
        <h1><i class="fa-solid fa-film"></i> Movie Discovery</h1>
        <button id="theme-toggle" aria-label="Chuyển đổi chế độ sáng/tối">
            <i class="fa-solid fa-moon"></i>
        </button>
    </header>

    <!-- Bố cục chính gồm 2 phần: Sidebar và Main Content -->
    <div class="app-container">
        <!-- Thanh bên (Sidebar): Chứa bộ lọc và tìm kiếm -->
        <aside class="sidebar">
            <div class="search-box">
                <label for="search-input"><i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm phim</label>
                <input type="text" id="search-input" placeholder="Nhập tên phim...">
            </div>

            <div class="filter-section">
                <h3>Thể loại</h3>
                <div id="genre-filters">
                    <!-- Các checkbox thể loại sẽ được render tự động bằng JS -->
                </div>
            </div>
        </aside>

        <!-- Khu vực hiển thị chính (Main Content): Danh sách thẻ phim -->
        <main class="main-content">
            <div id="movie-grid" class="movie-grid">
                <!-- Các thẻ phim (card) sẽ được render tự động bằng JS -->
            </div>
            <div id="no-results" class="no-results hidden">Không tìm thấy bộ phim nào phù hợp.</div>
        </main>
    </div>

    <!-- Cửa sổ Modal chi tiết phim -->
    <div id="movie-modal" class="modal hidden">
        <div class="modal-content">
            <button id="modal-close" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-body" id="modal-body">
                <!-- Nội dung chi tiết phim sẽ được đổ vào đây -->
            </div>
        </div>
    </div>

    <!-- Nhúng file dữ liệu và logic xử lý -->
    <script src="js/app.js"></script>
</body>
</html>
